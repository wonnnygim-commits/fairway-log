<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>페어웨이 · 저장 기록 점검</title><link rel="stylesheet" href="style.css"><body><main style="padding-top:30px"><span class="eyebrow">READ-ONLY STORAGE CHECK</span><h1>저장 기록 점검</h1><p>이 화면은 기록을 수정하거나 삭제하지 않습니다. 입력했던 브라우저에서 열어 주세요.</p><section class="card"><h2 id="status">확인 중</h2><p id="detail"></p><div id="records"></div><button id="backup" hidden>발견한 기록 백업 다운로드</button><button id="raw" hidden class="secondary">저장 원본 다운로드</button></section><section class="card"><h2>열린 환경</h2><p id="environment"></p><p class="hint">같은 아이폰에서도 Safari, 홈 화면 앱, 텔레그램 안의 브라우저, Safari 프로필에 따라 저장 공간이 다를 수 있습니다. 기록을 입력한 화면에서 확인하세요.</p></section><p class="hint">기록이 없다고 표시되어도 다른 브라우저 저장 공간의 기록까지 없다는 뜻은 아닙니다. 브라우저 데이터 삭제·앱 삭제는 하지 마세요. 점검 결과는 서버로 전송하지 않습니다.</p><a href="./">앱으로 돌아가기</a></main><script>
'use strict';
const $=id=>document.getElementById(id);
$('environment').textContent=location.origin+' · '+((navigator.standalone||matchMedia('(display-mode: standalone)').matches)?'홈 화면 앱 모드':'브라우저 모드');
function download(name,text){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
try{const raw=localStorage.getItem('fairway-rounds-v1');if(raw===null){$('status').textContent='이 저장 공간에 기록 키가 없습니다.';$('detail').textContent='어제 입력한 브라우저 또는 홈 화면 앱에서도 확인해 주세요.';}else{$('raw').hidden=false;$('raw').onclick=()=>download('fairway-storage-original.json',raw);try{const records=JSON.parse(raw);if(!Array.isArray(records))throw Error();$('status').textContent=`저장된 기록 ${records.length}개`;$('detail').textContent=records.length?'우선 백업을 다운로드해 보관하세요. 앱에서 안 보였다면 표시 문제일 수 있습니다.':'현재 저장된 목록이 비어 있습니다. 다른 저장 공간의 기록은 이 화면에서 확인할 수 없습니다.';for(const r of records){const p=document.createElement('p');p.textContent=typeof r==='object'&&r?`${r.date||'날짜 없음'} · ${r.course||'골프장 없음'} · ${Array.isArray(r.holes)?r.holes.filter(h=>h&&h.done).length:'?'}홀 · ${r.status||'상태 없음'}`:'읽을 수 없는 항목';$('records').append(p);}if(records.length){$('backup').hidden=false;$('backup').onclick=()=>download('fairway-recovered-backup.json',JSON.stringify({version:1,rounds:records},null,2));}}catch{$('status').textContent='저장 원본은 있으나 형식을 읽지 못했습니다.';$('detail').textContent='저장 원본 다운로드로 먼저 보존해 주세요. 이 화면은 원본을 덮어쓰지 않습니다.';}}}catch{$('status').textContent='브라우저 저장 공간에 접근하지 못했습니다.';$('detail').textContent='이 상태는 데이터 삭제 여부를 뜻하지 않습니다. 입력했던 브라우저인지 확인해 주세요.';}
</script></body></html>
